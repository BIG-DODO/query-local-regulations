<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地方规范查询工具 · 章节标注</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --brand:#0B2B5C; --brand-light:#134683; --bg:#F5F6F8; --white:#FFF; --border:#DDE1E6; --text:#333; --text-light:#666; --tag-bg:#E8F0FE; --tag-border:#B8D4FE; --tag-active-bg:#0B2B5C; --tag-active-text:#FFF; --selected:#C6E3FF; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.header { background:var(--brand); color:white; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.header h1 { font-size:18px; font-weight:600; }
.header .stats { font-size:13px; opacity:.85; }
.header .actions { display:flex; gap:8px; }
.header .actions button { padding:6px 14px; border:1px solid rgba(255,255,255,.3); border-radius:4px; background:rgba(255,255,255,.1); color:white; cursor:pointer; font-size:13px; }
.header .actions button:hover { background:rgba(255,255,255,.2); }
.container { display:flex; height:calc(100vh - 56px); }
.sidebar { width:240px; background:var(--white); border-right:1px solid var(--border); overflow-y:auto; flex-shrink:0; }
.sidebar h3 { padding:14px 16px 8px; font-size:13px; color:var(--text-light); text-transform:uppercase; letter-spacing:1px; }
.city-btn { display:block; width:100%; padding:10px 16px; border:none; background:transparent; text-align:left; cursor:pointer; font-size:14px; border-left:3px solid transparent; transition:.15s; }
.city-btn:hover { background:#F0F4F8; }
.city-btn.active { background:var(--selected); border-left-color:var(--brand); font-weight:600; }
.city-btn .badge { float:right; font-size:11px; background:var(--tag-bg); color:var(--brand); padding:1px 6px; border-radius:10px; }
.main { flex:1; overflow-y:auto; padding:20px; }
.city-title { font-size:20px; margin-bottom:4px; }
.city-meta { font-size:13px; color:var(--text-light); margin-bottom:16px; }
.file-list { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.file-tag { font-size:12px; background:#F0F4F8; border:1px solid var(--border); border-radius:4px; padding:4px 10px; }
.cat-bar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; }
.cat-tag { font-size:12px; padding:4px 10px; border-radius:14px; background:var(--tag-bg); border:1px solid var(--tag-border); cursor:pointer; transition:.15s; white-space:nowrap; }
.cat-tag:hover { background:#D4E4FC; }
.cat-tag.active { background:var(--tag-active-bg); color:var(--tag-active-text); border-color:var(--tag-active-bg); }
.heading-list { }
.heading-item { display:flex; align-items:flex-start; padding:10px 12px; border-bottom:1px solid var(--border); gap:10px; transition:.15s; }
.heading-item:hover { background:#FAFBFC; }
.heading-item.pl1 { padding-left:20px; }
.heading-item.pl2 { padding-left:36px; }
.heading-item.pl3 { padding-left:52px; }
.heading-item.pl4 { padding-left:68px; }
.heading-level { font-size:11px; color:var(--text-light); min-width:22px; text-align:center; background:#EDEFF2; border-radius:3px; padding:1px 4px; flex-shrink:0; }
.heading-source { font-size:10px; color:var(--brand-light); background:var(--tag-bg); padding:1px 5px; border-radius:3px; white-space:nowrap; flex-shrink:0; }
.heading-text { flex:1; font-size:14px; line-height:1.4; }
.heading-label { font-size:11px; color:var(--text-light); margin-top:2px; font-style:italic; }
.heading-tags { display:flex; gap:3px; flex-wrap:wrap; min-width:80px; justify-content:flex-end; }
.tag-dot { font-size:10px; padding:2px 6px; border-radius:8px; background:var(--tag-bg); color:var(--brand); white-space:nowrap; max-width:100px; overflow:hidden; text-overflow:ellipsis; }
.empty { text-align:center; color:var(--text-light); padding:60px 20px; }
.empty p { margin:8px 0; }
.modal { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,.4); z-index:1000; justify-content:center; align-items:center; }
.modal.show { display:flex; }
.modal-box { background:white; border-radius:8px; width:90%; max-width:600px; max-height:70vh; overflow-y:auto; padding:20px; }
.modal-box h3 { margin-bottom:12px; }
.modal-box .cat-check { display:flex; flex-wrap:wrap; gap:6px; }
.modal-box .cat-check label { display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer; padding:4px 8px; border-radius:4px; background:var(--tag-bg); }
.modal-box .cat-check label:hover { background:#D4E4FC; }
.modal-box .cat-check input[type=checkbox] { cursor:pointer; }
.modal-box .actions { margin-top:16px; display:flex; gap:8px; }
.modal-box button { padding:8px 16px; border-radius:4px; border:1px solid var(--border); cursor:pointer; font-size:14px; }
.modal-box .btn-primary { background:var(--brand); color:white; border:none; }
.modal-box .btn-primary:hover { background:var(--brand-light); }
.progress-bar { height:4px; background:var(--border); margin:8px 0; border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; background:var(--brand); transition:width .3s; }
.legend { display:flex; gap:12px; margin-bottom:12px; font-size:12px; color:var(--text-light); }
.legend span { display:flex; align-items:center; gap:4px; }
.legend .dot { width:8px; height:8px; border-radius:50%; }
.legend .dot.done { background:var(--brand); }
.legend .dot.partial { background:#FFB020; }
.legend .dot.empty { border:1.5px solid var(--border); background:white; }
.save-btn { position:fixed; bottom:20px; right:20px; padding:14px 24px; background:var(--brand); color:white; border:none; border-radius:8px; font-size:15px; cursor:pointer; box-shadow:0 4px 12px rgba(11,43,92,.3); z-index:100; }
.save-btn:hover { background:var(--brand-light); transform:translateY(-1px); }
.select-all-bar { display:flex; gap:8px; margin-bottom:8px; }
.select-all-bar button { font-size:11px; padding:3px 10px; border:1px solid var(--border); border-radius:10px; background:white; cursor:pointer; white-space:nowrap; }
.select-all-bar button:hover { background:var(--tag-bg); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>地方规范查询工具 · 章节标注</h1>
    <div class="stats">10城 · <span id="totalHeadings">0</span>条章节 · <span id="taggedCount">0</span>条已标注</div>
  </div>
  <div class="actions">
    <button onclick="exportJSON()">导出 JSON</button>
    <button onclick="importJSON()">导入 JSON</button>
  </div>
</div>

<div class="container">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="empty">
      <p style="font-size:48px;">👈</p>
      <p>选择左侧城市开始标注</p>
      <p style="font-size:13px;color:#999;">为每条章节打上23类规范标签</p>
    </div>
  </div>
</div>

<div class="modal" id="tagModal">
  <div class="modal-box">
    <h3 id="modalCity">标注章节标签</h3>
    <p id="modalHeading" style="font-size:14px;margin-bottom:12px;color:var(--text-light);"></p>
    <div class="cat-check" id="catCheckboxes"></div>
    <div class="actions">
      <button class="btn-primary" onclick="saveTags()">保存</button>
      <button onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<button class="save-btn" onclick="saveToStorage()">💾 保存进度</button>

let currentCity = null;
let currentHeadingId = null;
let taggedData = {}; // {city: {headingId: [catIds]}}

// Initialize from localStorage
try {
  const saved = localStorage.getItem('regulation_tagging');
  if (saved) taggedData = JSON.parse(saved);
} catch(e) {}

// ============================================================
// RENDER SIDEBAR
// ============================================================
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const regions = {};
  for (const [city, data] of Object.entries(CITIES_DATA)) {
    const r = data.region || '其他';
    if (!regions[r]) regions[r] = [];
    regions[r].push(city);
  }
  
  let html = '';
  for (const [region, cities] of Object.entries(regions)) {
    html += `<h3>${region}</h3>`;
    for (const city of cities) {
      const total = CITIES_DATA[city].headings.length;
      const tagged = (taggedData[city] ? Object.keys(taggedData[city]).length : 0);
      const pct = total ? Math.round(tagged/total*100) : 0;
      const badge = pct > 0 ? `<span class="badge">${pct}%</span>` : '';
      html += `<button class="city-btn" onclick="selectCity('${city}')">${city}${badge}</button>`;
    }
  }
  sidebar.innerHTML = html;
}

// ============================================================
// SELECT CITY & RENDER
// ============================================================
function selectCity(city) {
  currentCity = city;
  // Update sidebar active
  document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.city-btn').forEach(b => { if (b.textContent.includes(city)) b.classList.add('active'); });
  renderMain();
}

function renderMain() {
  if (!currentCity) return;
  
  const data = CITIES_DATA[currentCity];
  if (!data) return;
  
  const main = document.getElementById('main');
  const cityTags = taggedData[currentCity] || {};
  const totalTagged = Object.keys(cityTags).length;
  
  // Filters
  let activeCats = [];
  document.querySelectorAll('.cat-tag.active').forEach(t => activeCats.push(t.dataset.cat));
  
  let html = `<div class="city-title">${currentCity} <span style="font-size:13px;color:var(--text-light);">${data.region}</span></div>`;
  html += `<div class="city-meta">${data.files.length} 份文件 · ${data.headings.length} 条章节 · ${totalTagged} 条已标注</div>`;
  
  // Progress bar
  const pct = data.headings.length ? Math.round(totalTagged/data.headings.length*100) : 0;
  html += `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  
  // File list
  html += `<div class="file-list">`;
  for (const f of data.files) {
    const note = f.note ? ` · ${f.note}` : '';
    html += `<span class="file-tag">📄 ${f.name} (${f.pages}页${note})</span>`;
  }
  html += `</div>`;
  
  // Category bar
  html += `<div class="cat-bar">`;
  for (const cat of CATEGORIES) {
    const active = activeCats.includes(cat.id) ? ' active' : '';
    html += `<span class="cat-tag${active}" data-cat="${cat.id}" onclick="toggleCat('${cat.id}')" title="${cat.desc}">${cat.label}</span>`;
  }
  html += `</div>`;
  
  // Category group select buttons
  html += `<div class="select-all-bar">`;
  html += `<button onclick="selectCatGroup('规划')">选 规划(13项)</button>`;
  html += `<button onclick="selectCatGroup('建筑')">选 建筑(1项)</button>`;
  html += `<button onclick="selectCatGroup('结构')">选 结构(1项)</button>`;
  html += `<button onclick="selectCatGroup('机电')">选 机电(1项)</button>`;
  html += `<button onclick="selectCatGroup('政策')">选 政策(7项)</button>`;
  html += `<button onclick="clearCatFilters()">清除筛选</button>`;
  html += `</div>`;
  
  // Filter headings
  let filteredHeadings = data.headings;
  if (activeCats.length > 0) {
    // Show only headings that have any of the active tags OR all headings (user may want to tag)
    filteredHeadings = data.headings.filter(h => {
      const tags = (cityTags[h.id] || []);
      return tags.some(t => activeCats.includes(t));
    });
    if (filteredHeadings.length === 0) {
      filteredHeadings = data.headings; // show all if no match
    }
  }
  
  // Heading list
  html += `<div class="heading-list">`;
  if (filteredHeadings.length === 0) {
    html += `<div class="empty"><p>暂无章节数据</p></div>`;
  }
  
  for (const h of filteredHeadings) {
    const levelClass = 'pl' + Math.min(h.level || 2, 4);
    const levelLabel = {2:'章',3:'节',4:'附录',1:'篇'}[h.level] || '';
    const hTags = (cityTags[h.id] || []);
    
    // Tag display
    let tagsHtml = '';
    if (hTags.length > 0) {
      for (const tid of hTags) {
        const cat = CATEGORIES.find(c => c.id === tid);
        if (cat) tagsHtml += `<span class="tag-dot" title="${cat.label}">${cat.label.split(' ')[0]}</span>`;
      }
    } else {
      tagsHtml = `<span style="color:#ccc;font-size:10px;">待标注</span>`;
    }
    
    html += `<div class="heading-item ${levelClass}" onclick="openTagModal('${h.id}')" style="cursor:pointer;">`;
    html += `<span class="heading-level">${levelLabel}</span>`;
    if (h.source) html += `<span class="heading-source">${h.source}</span>`;
    html += `<span class="heading-text">${h.title}`;
    if (h.label) html += `<br><span class="heading-label">${h.label}</span>`;
    html += `</span>`;
    html += `<span class="heading-tags">${tagsHtml}</span>`;
    html += `</div>`;
  }
  html += `</div>`;
  
  main.innerHTML = html;
  updateStats();
}

// ============================================================
// TAG MODAL
// ============================================================
let currentHeadingObj = null;

function openTagModal(headingId) {
  currentHeadingId = headingId;
  const data = CITIES_DATA[currentCity];
  const h = data.headings.find(x => x.id === headingId);
  if (!h) return;
  currentHeadingObj = h;
  
  document.getElementById('modalCity').textContent = currentCity;
  document.getElementById('modalHeading').textContent = h.title;
  
  const cityTags = taggedData[currentCity] || {};
  const currentTags = cityTags[headingId] || [];
  
  // Group categories
  const groups = {};
  for (const cat of CATEGORIES) {
    const g = cat.group || '其他';
    if (!groups[g]) groups[g] = [];
    groups[g].push(cat);
  }
  
  let catHtml = '';
  for (const [group, cats] of Object.entries(groups)) {
    catHtml += `<div style="margin-bottom:8px"><strong style="font-size:12px;color:var(--text-light)">${group}类</strong></div>`;
    catHtml += `<div class="cat-check" style="margin-bottom:12px">`;
    for (const cat of cats) {
      const checked = currentTags.includes(cat.id) ? 'checked' : '';
      catHtml += `<label><input type="checkbox" value="${cat.id}" ${checked}> ${cat.label.split(' ')[1]||cat.label}</label>`;
    }
    catHtml += `</div>`;
  }
  
  document.getElementById('catCheckboxes').innerHTML = catHtml;
  document.getElementById('tagModal').classList.add('show');
}

function saveTags() {
  if (!currentCity || !currentHeadingId) return;
  
  const checked = [];
  document.querySelectorAll('#catCheckboxes input:checked').forEach(cb => checked.push(cb.value));
  
  if (!taggedData[currentCity]) taggedData[currentCity] = {};
  taggedData[currentCity][currentHeadingId] = checked;
  
  closeModal();
  renderMain();
  renderSidebar();
  updateStats();
}

function closeModal() {
  document.getElementById('tagModal').classList.remove('show');
}

// ============================================================
// FILTERS
// ============================================================
function toggleCat(catId) {
  const tag = document.querySelector(`.cat-tag[data-cat="${catId}"]`);
  if (tag) tag.classList.toggle('active');
  renderMain();
}

function selectCatGroup(group) {
  // Clear all first
  document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
  // Select matching
  for (const cat of CATEGORIES) {
    if (cat.group === group) {
      document.querySelector(`.cat-tag[data-cat="${cat.id}"]`)?.classList.add('active');
    }
  }
  renderMain();
}

function clearCatFilters() {
  document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
  renderMain();
}

// ============================================================
// SAVE / EXPORT / IMPORT
// ============================================================
function saveToStorage() {
  localStorage.setItem('regulation_tagging', JSON.stringify(taggedData));
  alert('✅ 进度已保存到浏览器');
}

function updateStats() {
  let total = 0, tagged = 0;
  for (const [city, data] of Object.entries(CITIES_DATA)) {
    total += data.headings.length;
    tagged += (taggedData[city] ? Object.keys(taggedData[city]).length : 0);
  }
  document.getElementById('totalHeadings').textContent = total;
  document.getElementById('taggedCount').textContent = tagged;
}

function exportJSON() {
  const output = {
    categories: CATEGORIES,
    cities: CITIES_DATA,
    tagging: taggedData,
    exported: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(output, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tagging_export.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.tagging) {
          taggedData = data.tagging;
          saveToStorage();
          renderSidebar();
          if (currentCity) renderMain();
          updateStats();
          alert('✅ 导入成功');
        } else {
          alert('❌ 无效的标注文件');
        }
      } catch(e) {
        alert('❌ JSON 解析失败');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ============================================================
// INIT
// ============================================================
renderSidebar();
updateStats();

// Auto-save every 30s
setInterval(saveToStorage, 30000);

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>
